<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e5dc;color:#14202b;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#2574a3}a:hover{color:#1b5a80}
</style>
</helmet>
<div style="padding:48px;display:flex;flex-direction:column;gap:32px;min-width:max-content;">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <span style="font-size:14px;font-weight:700;color:#5e6870;">Page</span>
    <sc-for list="{{ pages }}" as="p" hint-placeholder-count="5">
      <button onClick="{{ p.pick }}" style="font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:10px 18px;border-radius:999px;border:1.5px solid {{ p.border }};background:{{ p.bg }};color:{{ p.color }};">{{ p.label }}</button>
    </sc-for>
    <span style="font-size:13px;color:#5e6870;margin-left:8px;">Both frames are live. Click through them.</span>
  </div>
  <div style="display:flex;gap:48px;align-items:flex-start;">
    <x-import component-from-global-scope="ChromeWindow" from="./browser-window.jsx" width="{{ 1280 }}" height="{{ 800 }}" url="{{ macTitle }}" tabs="{{ tabs }}" hint-size="1280px,800px">
      <iframe src="{{ src }}" title="Laptop preview" style="width:100%;height:100%;border:0;display:block;background:#fbfaf7;"></iframe>
    </x-import>
    <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="402px,874px">
      <iframe src="{{ phoneSrc }}" title="Phone preview" style="width:100%;height:100%;border:0;display:block;background:#fbfaf7;"></iframe>
    </x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'home.dc.html' };
  renderVals() {
    const list = [['Home','home.dc.html'],['About Us','about.dc.html'],['Services','services.dc.html'],['Contact','contact.dc.html'],['Book now','book.dc.html']];
    const cur = this.state.page;
    return {
      src: './' + cur, phoneSrc: './' + cur + '?frame=1',
      macTitle: 'limerickboilers.ie/' + cur.replace('.dc.html',''), tabs: [{ title: 'Limerick Boilers' }],
      pages: list.map(([label, f]) => { const on = f === cur; return { label, pick: () => this.setState({ page: f }),
        border: on ? '#2574a3' : '#c9c4b8', bg: on ? '#2574a3' : '#fff', color: on ? '#fff' : '#14202b' }; }),
    };
  }
}
</script>
</body>
</html>
